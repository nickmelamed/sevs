[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sevs"
version = "0.1.0"
description = "Self-Evaluating Vision System: uncertainty + consistency probing + error prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy",
  "scikit-learn",
  "pandas",
  "matplotlib",
  "opencv-python",
  "pyyaml",
  "pillow",
  "torch",
  "torchvision",
]

[project.optional-dependencies]
yolo = ["ultralytics"]
dev = ["pytest", "hypothesis", "pycocotools", "ruff", "mypy", "types-PyYAML", "pandas-stubs"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["sevs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that take more than a few seconds"]
